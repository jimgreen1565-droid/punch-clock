<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="考勤打卡 · 四种考勤规则可选，本地哈希链防篡改">
<title>考勤打卡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f6ef7'/><circle cx='50' cy='48' r='26' fill='none' stroke='white' stroke-width='6'/><path d='M50 30v18l12 8' stroke='white' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="bg-mesh.css">
</head>
<body>

<!-- 顶部状态栏（真机上是系统状态栏，这里浅色不遮挡） -->
<div class="shell">
  <header class="topbar" id="topbar">
    <button class="tb-back" id="navBack" aria-label="返回"></button>
    <h1 class="tb-title" id="navTitle">考勤打卡</h1>
    <div class="tb-actions"><button class="tb-btn" id="tbMore" aria-label="更多">⋯</button></div>
  </header>
  <main class="content" id="body"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-page="index" aria-label="打卡"><span class="ti" data-icon="clock"></span><span class="tl">打卡</span></button>
    <button class="tab" data-page="records" aria-label="记录"><span class="ti" data-icon="list"></span><span class="tl">记录</span></button>
    <button class="tab" data-page="me" aria-label="我的"><span class="ti" data-icon="user"></span><span class="tl">我的</span></button>
  </nav>
</div>

<!-- 通用弹层 -->
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-shell">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="core-bundle.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
